<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Ember &amp; Roll | Fire-Grilled Chicken Rolls, Gulshan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0b;
      --surface: #151515;
      --text: #f4efe6;
      --muted: #a39d92;
      --gold: #c9a24b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', Arial, sans-serif;
      line-height: 1.6;
    }

    /* Sticky navigation bar */
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(11, 11, 11, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--gold);
      text-decoration: none;
    }
    .nav a.link {
      color: var(--muted);
      text-decoration: none;
      margin-left: 20px;
      font-size: 0.9rem;
    }
    .nav a.link:hover { color: var(--text); }

    /* Hero section */
    .hero {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 48px 24px;
      background: radial-gradient(circle at 50% 30%, #2a2112 0%, var(--bg) 65%);
    }
    .eyebrow {
      color: var(--gold);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: 0.75rem;
      margin: 0 0 16px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.5rem, 9vw, 5rem);
      line-height: 1.1;
      margin: 0 0 16px;
    }
    .hero p.sub {
      max-width: 480px;
      color: var(--muted);
      margin: 0 0 32px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: var(--gold);
      color: #111;
      font-weight: 600;
      text-decoration: none;
      border-radius: 999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201, 162, 75, 0.35);
    }
        /* Menu section */
    .section {
      max-width: 1000px;
      margin: 0 auto;
      padding: 72px 24px;
    }
    .section h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      margin: 0 0 8px;
    }
    .section .lead {
      color: var(--muted);
      margin: 0 0 32px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
    }
    .card h3 {
      font-family: 'Playfair Display', serif;
      margin: 0 0 8px;
      font-size: 1.25rem;
    }
    .card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 20px;
      flex-grow: 1;
    }
    .card .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price {
      color: var(--gold);
      font-weight: 600;
    }
    .add-btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 8px 18px;
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .add-btn:hover {
      background: var(--gold);
      color: #111;
    }
      /* Cart button in the nav */
    .cart-btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 6px 16px;
      margin-left: 20px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Slide-out cart panel */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .cart-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: min(380px, 100%);
      background: var(--surface);
      border-left: 1px solid #262626;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 30;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    .cart-panel.open { transform: translateX(0); }
    .cart-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .cart-head h3 {
      font-family: 'Playfair Display', serif;
      margin: 0;
      font-size: 1.4rem;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.6rem;
      cursor: pointer;
    }
    .cart-items { flex-grow: 1; overflow-y: auto; }
    .empty { color: var(--muted); }
    .cart-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #262626;
    }
    .cart-line .name { font-weight: 500; }
    .cart-line .sub { color: var(--muted); font-size: 0.85rem; }
    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
    }
    .cart-foot { padding-top: 16px; }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      margin-bottom: 16px;
    }
    .checkout-btn {
      width: 100%;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
    }

    /* "Added to cart" message */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 80px);
      background: var(--gold);
      color: #111;
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 600;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 40;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
  </style>
</head>
<body>

  <nav class="nav">
    <a class="logo" href="#top">Ember &amp; Roll</a>
    <div>
      <a class="link" href="#menu">Menu</a>
            <button class="cart-btn" id="cart-open">Cart (<span id="cart-count">0</span>)</button>
    </div>
  </nav>

  <header class="hero" id="top">
    <p class="eyebrow">Gulshan, Dhaka</p>
    <h1>Fire-grilled.<br>Rolled to order.</h1>
    <p class="sub">Charcoal-grilled chicken, wrapped fresh in warm, buttery paratha. Made the slow way, served fast.</p>
    <a class="btn" href="#menu">See the Menu</a>
  </header>
  <section class="section" id="menu">
    <h2>The Menu</h2>
    <p class="lead">Grilled over charcoal, rolled to order.</p>
    <div class="menu-grid" id="menu-grid"></div>
  </section>
    <div class="overlay" id="overlay"></div>
  <aside class="cart-panel" id="cart-panel">
    <div class="cart-head">
      <h3>Your Order</h3>
      <button class="close-btn" id="cart-close">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-foot">
      <div class="total-row"><span>Total</span><strong id="cart-total">৳0</strong></div>
      <button class="btn checkout-btn" id="checkout-btn">Checkout</button>
    </div>
  </aside>
  <div class="toast" id="toast">Added to cart</div>
  <script>
    // Our menu data. Later this will come from the database.
    const menuItems = [
      { id: 1, name: "Classic Ember Roll", desc: "Charcoal-grilled chicken, onion, house mint chutney.", price: 220 },
      { id: 2, name: "Spicy Peri Roll", desc: "Peri-peri marinated chicken with crunchy slaw.", price: 250 },
      { id: 3, name: "Cheesy Melt Roll", desc: "Grilled chicken with melted cheese and garlic sauce.", price: 280 },
      { id: 4, name: "Smoky BBQ Roll", desc: "Smoked BBQ glaze, pickled onion, fresh cucumber.", price: 260 },
      { id: 5, name: "Loaded Fries", desc: "Crispy fries with sauce and a sprinkle of spice.", price: 120 },
      { id: 6, name: "Mint Lemonade", desc: "Fresh lime, mint and a little sparkle.", price: 90 }
    ];

    // Build one card for each menu item and put it on the page.
    const grid = document.getElementById("menu-grid");
    grid.innerHTML = menuItems.map(item => `
      <div class="card">
        <h3>${item.name}</h3>
        <p>${item.desc}</p>
        <div class="row">
          <span class="price">৳${item.price}</span>
          <button class="add-btn" data-id="${item.id}">+ Add</button>
        </div>
      </div>
    `).join("");
      // ----- Cart logic -----
    let cart = []; // each line looks like { id: 1, qty: 2 }

    const overlay = document.getElementById("overlay");
    const panel = document.getElementById("cart-panel");
    const itemsBox = document.getElementById("cart-items");
    const totalEl = document.getElementById("cart-total");
    const countEl = document.getElementById("cart-count");
    const toast = document.getElementById("toast");

    function openCart() {
      panel.classList.add("open");
      overlay.classList.add("show");
    }
    function closeCart() {
      panel.classList.remove("open");
      overlay.classList.remove("show");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    function addToCart(id) {
      const line = cart.find(l => l.id === id);
      if (line) { line.qty += 1; } else { cart.push({ id: id, qty: 1 }); }
      renderCart();
      showToast("Added to cart");
    }

    function changeQty(id, delta) {
      const line = cart.find(l => l.id === id);
      if (!line) return;
      line.qty += delta;
      if (line.qty <= 0) { cart = cart.filter(l => l.id !== id); }
      renderCart();
    }

    function renderCart() {
      let total = 0;
      let count = 0;
      const html = cart.map(line => {
        const item = menuItems.find(m => m.id === line.id);
        total += item.price * line.qty;
        count += line.qty;
        return `
          <div class="cart-line">
            <div>
              <div class="name">${item.name}</div>
              <div class="sub">৳${item.price} each</div>
            </div>
            <div class="qty">
              <button class="qty-btn" data-id="${item.id}" data-delta="-1">−</button>
              <span>${line.qty}</span>
              <button class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
            </div>
          </div>`;
      }).join("");
      itemsBox.innerHTML = html || '<p class="empty">Your cart is empty.</p>';
      totalEl.textContent = "৳" + total;
      countEl.textContent = count;
    }

    // Listen for taps and clicks
    grid.addEventListener("click", e => {
      const btn = e.target.closest(".add-btn");
      if (btn) addToCart(Number(btn.dataset.id));
    });
    itemsBox.addEventListener("click", e => {
      const btn = e.target.closest(".qty-btn");
      if (btn) changeQty(Number(btn.dataset.id), Number(btn.dataset.delta));
    });
    document.getElementById("cart-open").addEventListener("click", openCart);
    document.getElementById("cart-close").addEventListener("click", closeCart);
    overlay.addEventListener("click", closeCart);

    renderCart();
  </script>
</body>
</html>
